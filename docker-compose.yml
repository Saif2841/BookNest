services:
  mongo:
    image: mongo:6
    restart: always
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
  app:
    build: .
    environment:
      - MONGO_URI=mongodb://mongo:27017/booknest
      - JWT_SECRET=${JWT_SECRET:-supersecret}
      - PORT=3000
    ports: ["3001:3000"]
    volumes:
      - ./uploads:/app/uploads
    depends_on: [mongo]
volumes:
  mongo_data:
